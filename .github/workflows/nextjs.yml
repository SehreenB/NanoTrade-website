name: Deploy Next.js site to Pages

on:
  push:
    branches: ["seeron"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: './nanotrade-next/package-lock.json'
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: cd nanotrade-next && npm install --legacy-peer-deps
        
      - name: Build with Next.js
        run: cd nanotrade-next && npx next build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./nanotrade-next/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4